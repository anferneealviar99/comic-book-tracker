{% extends 'base.html' %}

{% block title %}Change Username{% endblock %}
{% block content %}

<div class='mt-5 block px-6 max-w-md'>
    <h2 class='text-2xl font-bold mb-4'>Change Username</h2>

    {% if error %}
        <p class='text-red-600 mb-3'>{{ error }}</p>
    {% endif %}

    <form method='post' action='{% url "change_username" %}' class='flex flex-col gap-3'>
        {% csrf_token %}
        <label for='username' class='text-sm font-medium text-gray-700'>New username</label>
        <input type='text' name='username' id='username' value='{{ request.user.username }}' 
            class='border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500'>
        <button type='submit' 
            class='bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors'>
            Save
        </button>
    </form>

    <p class='mt-4'><a href='{% url "user_comics" %}' class='text-blue-600 hover:underline'>Back to My Comics</a></p>
</div>

{% endblock %}
